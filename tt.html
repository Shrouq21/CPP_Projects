<html>
<head>
    <title>Data Process Level System</title>
</head>

<body>

<h1>Data Process Level</h1>

<form action="http://norton.open.ac.uk/reflect.php" method="post">

    <!-- Username -->
    Username:
    <input type="text" name="username">
    <br><br>

    <!-- Password -->
    Password:
    <input type="password" name="password">
    <br><br>

    <!-- Admin Level List -->
    Admin Level:
    <select name="admin_level">
        <option value="admin">Admin Level</option>
    </select>
    <br><br>

    <!-- User Level List -->
    User Level:
    <select name="user_level">
        <option value="user">User Level</option>
    </select>
    <br><br>

    <!-- Hidden field -->
    <input type="hidden" name="status" value="Approved Level">

    <!-- Submit button -->
    <input type="submit" name="submit" value="Submit">

    <!-- Reset button -->
    <input type="reset" name="reset" value="Reset">

</form>

</body>
</html>
